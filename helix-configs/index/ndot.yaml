version: 3
indices:
  site:
    exclude:
      - tools/**
      - library/**
      - footer
      - nav
      - alert
      - search-results
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      hideInSideNav:
        select: head > meta[name="hide-in-side-nav"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
      navOrder:
        select: head > meta[name="nav-order"]
        value: |
          attribute(el, 'content')
  search:
    exclude:
      - tools/**
      - library/**
      - footer
      - nav
      - alert
      - test-pages/**
    target: /search-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      keywords:
        select: head > meta[name="keywords"]
        value: |
          attribute(el, 'content')
      tags:
        select: head > meta[property="article:tag"]
        values: |
          attribute(el, 'content')
      h2s:
        select: h2
        values: |
          textContent(el)
      body:
        selectFirst: main p
        value: textContent(el)
      lastModified:
        select: none
        value: |
          parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
      publicationDate:
        select: head > meta[name="publication-date"]
        value: |
          attribute(el, 'content')    
  procurement:
    include:
      - /business-center/procurement/**
    exclude:
      - business-center/procurement/policies-and-forms/**
      - business-center/procurement/policies-and-procedures
      - business-center/procurement/
    target: /procurement.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      tags:
        select: head > meta[name="tag"]
        values: |
          attribute(el, 'content')
      bidPageData:
        select: head > meta[name="bidpagedata"]
        value: |
          attribute(el, 'content')
      buyer:
        select: head > meta[name="buyer"]
        value: |
          attribute(el, 'content')    
      deadlineDate:
        select: head > meta[name="deadlinedate"]
        value: |
          attribute(el, 'content')    
      itemName:
        select: head > meta[name="itemname"]
        value: |
          attribute(el, 'content')    
      openDate:
        select: head > meta[name="opendate"]
        value: |
          attribute(el, 'content')    
      postDate:
        select: head > meta[name="postdate"]
        value: |
          attribute(el, 'content')    
      updatedDeadlineDate:
        select: head > meta[name="updateddeadlinedate"]
        value: |
          attribute(el, 'content')